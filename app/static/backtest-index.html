<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>回测 | LucyGetUp</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #07151d;
        --panel: rgba(17, 37, 47, 0.86);
        --line: rgba(192, 226, 232, 0.18);
        --ink: #f5fbff;
        --muted: #a7c0c8;
        --accent: #45d5c8;
        --accent-strong: #1da99e;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 32px 20px;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 10%, rgba(48, 182, 177, 0.28), transparent 32%),
          radial-gradient(circle at 88% 82%, rgba(246, 188, 77, 0.1), transparent 30%),
          var(--bg);
        font-family: "Segoe UI Variable Display", "Segoe UI", "Microsoft YaHei UI", sans-serif;
      }

      main { width: min(960px, 100%); margin: 0 auto; }

      .breadcrumb {
        display: flex;
        gap: 10px;
        margin-bottom: 46px;
        color: var(--muted);
        font-size: 14px;
      }

      .breadcrumb a { color: var(--accent); text-decoration: none; }

      h1 { margin: 0 0 12px; font-size: clamp(40px, 7vw, 72px); line-height: 1; }
      .intro { max-width: 620px; margin: 0 0 34px; color: var(--muted); font-size: 18px; line-height: 1.6; }

      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }

      .card {
        display: flex;
        min-height: 220px;
        flex-direction: column;
        justify-content: space-between;
        padding: 26px;
        border: 1px solid var(--line);
        border-radius: 18px;
        color: var(--ink);
        background: var(--panel);
        box-shadow: 0 22px 60px rgba(0, 0, 0, 0.2);
        text-decoration: none;
        transition: border-color 160ms ease, transform 160ms ease, background 160ms ease;
      }

      .card:hover, .card:focus-visible {
        border-color: rgba(69, 213, 200, 0.75);
        background: rgba(20, 54, 62, 0.92);
        outline: none;
        transform: translateY(-3px);
      }

      .card-label { color: var(--accent); font-size: 13px; font-weight: 700; letter-spacing: 0.08em; }
      .card h2 { margin: 14px 0 10px; font-size: 26px; }
      .card p { margin: 0; color: var(--muted); line-height: 1.6; }
      .card-action { margin-top: 28px; color: var(--accent); font-weight: 700; }

      @media (max-width: 560px) {
        body { padding: 22px 16px; }
        .breadcrumb { margin-bottom: 34px; }
      }
    </style>
  </head>
  <body>
    <main>
      <nav class="breadcrumb" aria-label="当前位置">
        <a href="/">主页</a><span>/</span><span>回测</span>
      </nav>
      <h1>回测</h1>
      <p class="intro">选择一个回测策略，先用历史数据检验组合规则，再决定是否进入纸面交易。</p>
      <section class="cards" aria-label="回测工具">
        <a class="card" href="permanent-investment/">
          <div>
            <div class="card-label">PERMANENT INVESTMENT</div>
            <h2>永久投资策略</h2>
            <p>组合 ETF、黄金和国债逆回购，查看长期收益、回撤、资产权重与交易记录。</p>
          </div>
          <span class="card-action">进入回测 →</span>
        </a>
        <a class="card" href="all-weather/">
          <div>
            <div class="card-label">ALL WEATHER ALLOCATION</div>
            <h2>全天候资产配置回测</h2>
            <p>调整股票、债券、黄金和现金的目标比例，使用真实行情查看收益、回撤、权重变化与交易记录。</p>
          </div>
          <span class="card-action">进入回测 →</span>
        </a>
      </section>
    </main>
  </body>
</html>
